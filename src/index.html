<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<script>
(function () {
  var show = new URLSearchParams(location.search).get("show") || "";
  if (show.indexOf("glassline") !== 0) return;
  document.documentElement.dataset.show = "glassline";
  document.title = "GLASSLINE — Rooftop Induction";
  var copy = {
    "Raising the terminal": "BOOTING ROOFTOP SYSTEMS",
    "Waking the renderer": "INITIALIZING CITY LIGHT",
    "Mixing paint, rust and rain": "POLISHING GLASS AND CONCRETE",
    "Stacking containers": "ASSEMBLING ROOFTOPS",
    "Raising the cranes": "BUILDING SKYLINE",
    "Flooding the apron": "SETTING THE SKY",
    "Loading tracers and smoke": "TUNING AIR AND LIGHT",
    "Checking the rifle": "SYNCING MOVEMENT",
    "Waking the Harbormaster": "CALIBRATING THE COURSE",
    "Waiting for first light": "WAITING FOR THE SUN",
    "Ready": "READY TO RUN"
  };
  function apply() {
    var mark = document.querySelector(".boot-mark");
    if (mark) mark.textContent = "GLASSLINE";
    var sub = document.querySelector("#boot-msg");
    if (sub && copy[sub.textContent]) sub.textContent = copy[sub.textContent];
    var boot = document.querySelector("#boot");
    if (boot && !boot.querySelector(".gl-boot-tag")) {
      var tag = document.createElement("div");
      tag.className = "gl-boot-tag";
      tag.textContent = "CITY OF LIGHT / ROOFTOP INDUCTION";
      boot.appendChild(tag);
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      apply();
      var sub = document.querySelector("#boot-msg");
      if (sub) {
        new MutationObserver(apply).observe(sub, { childList: true, characterData: true, subtree: true });
      }
    }, { once: true });
  } else {
    apply();
  }
})();
</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saltline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<div id="app">
  <canvas id="view" tabindex="0"></canvas>
  <div id="ui"></div>
  <div id="boot">
    <div class="boot-mark">SALTLINE</div>
    <div class="boot-sub" id="boot-msg">Raising the terminal</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
  </div>
</div>
<script type="module" src="/game/main.js"></script>

</body>
</html>

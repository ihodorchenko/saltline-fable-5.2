name: CI

on:
  push:
    branches: [dev, 'feat/**', '!feat/glassline-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build single-file bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright boot tests
        run: npx playwright test

      - name: Headless smoke
        run: npx playwright test tests/e2e/smoke.spec.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload smoke and performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-perf
          path: |
            artifacts/ci-smoke.png
            artifacts/perf-baseline.json
          retention-days: 7
